<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- N -->
  <rect x="10" y="15" width="4" height="30" fill="url(#grad1)"/>
  <rect x="10" y="15" width="20" height="4" fill="url(#grad1)"/>
  <rect x="26" y="15" width="4" height="30" fill="url(#grad1)"/>
  
  <!-- E (三个横杠) -->
  <rect x="40" y="15" width="20" height="4" fill="url(#grad1)"/>
  <rect x="40" y="27" width="15" height="4" fill="url(#grad1)"/>
  <rect x="40" y="41" width="20" height="4" fill="url(#grad1)"/>
  
  <!-- L -->
  <rect x="70" y="15" width="4" height="30" fill="url(#grad1)"/>
  <rect x="70" y="41" width="18" height="4" fill="url(#grad1)"/>
  
  <!-- S -->
  <rect x="98" y="15" width="18" height="4" fill="url(#grad1)"/>
  <rect x="98" y="15" width="4" height="15" fill="url(#grad1)"/>
  <rect x="98" y="27" width="18" height="4" fill="url(#grad1)"/>
  <rect x="112" y="27" width="4" height="15" fill="url(#grad1)"/>
  <rect x="98" y="41" width="18" height="4" fill="url(#grad1)"/>
  
  <!-- 分隔点 -->
  <circle cx="125" cy="30" r="3" fill="url(#grad1)"/>
  
  <!-- A (去掉中间横杠) -->
  <polygon points="140,45 145,15 150,45" fill="url(#grad1)"/>
  <polygon points="155,45 160,15 165,45" fill="url(#grad1)"/>
  <rect x="145" y="15" width="15" height="4" fill="url(#grad1)"/>
  
  <!-- I -->
  <rect x="175" y="15" width="15" height="4" fill="url(#grad1)"/>
  <rect x="180" y="15" width="4" height="30" fill="url(#grad1)"/>
  <rect x="175" y="41" width="15" height="4" fill="url(#grad1)"/>
</svg>