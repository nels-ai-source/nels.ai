<svg width="240" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5B73FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- N -->
  <rect x="20" y="25" width="8" height="30" fill="url(#grad4)" transform="skewX(-10)"/>
  <rect x="20" y="25" width="25" height="8" fill="url(#grad4)"/>
  <rect x="37" y="25" width="8" height="30" fill="url(#grad4)" transform="skewX(-10)"/>
  
  <!-- E (三个横杠) -->
  <rect x="55" y="25" width="25" height="8" fill="url(#grad4)"/>
  <rect x="55" y="36" width="18" height="8" fill="url(#grad4)"/>
  <rect x="55" y="47" width="25" height="8" fill="url(#grad4)"/>
  
  <!-- L -->
  <rect x="90" y="25" width="8" height="30" fill="url(#grad4)" transform="skewX(-10)"/>
  <rect x="90" y="47" width="22" height="8" fill="url(#grad4)"/>
  
  <!-- S -->
  <rect x="122" y="25" width="22" height="8" fill="url(#grad4)"/>
  <rect x="122" y="25" width="8" height="14" fill="url(#grad4)" transform="skewX(-10)"/>
  <rect x="122" y="36" width="22" height="8" fill="url(#grad4)"/>
  <rect x="136" y="36" width="8" height="14" fill="url(#grad4)" transform="skewX(-10)"/>
  <rect x="122" y="47" width="22" height="8" fill="url(#grad4)"/>
  
  <!-- 分隔线 -->
  <rect x="154" y="35" width="12" height="8" fill="url(#grad4)" transform="rotate(45 160 39)"/>
  
  <!-- A (去掉中间横杠) -->
  <polygon points="175,55 182,25 189,55" fill="url(#grad4)"/>
  <polygon points="191,55 198,25 205,55" fill="url(#grad4)"/>
  <rect x="182" y="25" width="16" height="8" fill="url(#grad4)"/>
  
  <!-- I -->
  <rect x="215" y="25" width="18" height="8" fill="url(#grad4)"/>
  <rect x="220" y="25" width="8" height="30" fill="url(#grad4)" transform="skewX(-10)"/>
  <rect x="215" y="47" width="18" height="8" fill="url(#grad4)"/>
</svg>