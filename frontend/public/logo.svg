<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285EB" />
      <stop offset="100%" stop-color="#2EC7FF" />
    </linearGradient>
    <linearGradient id="secondary-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29CDFF" />
      <stop offset="100%" stop-color="#0A60FF" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA816E" />
      <stop offset="100%" stop-color="#F51D2C" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="#FFFFFF" stroke="url(#primary-gradient)" stroke-width="3" />
  
  <!-- 神经网络节点和连接 -->
  <g id="neural-network">
    <!-- 中心节点 -->
    <circle cx="100" cy="100" r="15" fill="url(#accent-gradient)" />
    
    <!-- 外围节点 -->
    <circle cx="60" cy="70" r="8" fill="url(#primary-gradient)" />
    <circle cx="140" cy="70" r="8" fill="url(#primary-gradient)" />
    <circle cx="60" cy="130" r="8" fill="url(#primary-gradient)" />
    <circle cx="140" cy="130" r="8" fill="url(#primary-gradient)" />
    <circle cx="100" cy="50" r="8" fill="url(#secondary-gradient)" />
    <circle cx="100" cy="150" r="8" fill="url(#secondary-gradient)" />
    
    <!-- 连接线 -->
    <line x1="100" y1="85" x2="100" y2="58" stroke="url(#secondary-gradient)" stroke-width="2" />
    <line x1="100" y1="115" x2="100" y2="142" stroke="url(#secondary-gradient)" stroke-width="2" />
    <line x1="85" y1="100" x2="68" y2="78" stroke="url(#primary-gradient)" stroke-width="2" />
    <line x1="115" y1="100" x2="132" y2="78" stroke="url(#primary-gradient)" stroke-width="2" />
    <line x1="85" y1="100" x2="68" y2="122" stroke="url(#primary-gradient)" stroke-width="2" />
    <line x1="115" y1="100" x2="132" y2="122" stroke="url(#primary-gradient)" stroke-width="2" />
  </g>
  
  <!-- 文字 -->
  <g id="text" transform="translate(100, 180)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0A60FF">Nels.ai</text>
  </g>
  
  <!-- 脉冲动画效果 -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="url(#accent-gradient)" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="25;40;25" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>